services:
  - type: web
    name: pocketlens-api
    runtime: python
    rootDir: finance-backend
    plan: free
    healthCheckPath: /health
    buildCommand: pip install -r sync-service/requirements.txt
    startCommand: cd sync-service && uvicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PLAID_WEBHOOK_URL
        sync: false
      # This service's own /link URL (e.g. https://your-api.onrender.com/link).
      # Enables OAuth banks (Chase, BofA, …): passed as redirect_uri on link tokens;
      # each BYO user allowlists it in their Plaid dashboard (onboarding wizard step).
      - key: PLAID_REDIRECT_URI
        sync: false
      # CORS allowlist for the browser web app (api.py). Comma-separated origins,
      # scheme included. Set to pocketlens-web's URL once its first deploy mints it
      # (Render can't inject a static site's public URL via fromService).
      - key: WEB_ORIGINS
        sync: false
      # Fernet key for Plaid secrets + access tokens at rest (vault.py).
      # If you re-add the pocketlens-sync cron later, it MUST use this same value.
      - key: CREDENTIALS_ENC_KEY
        sync: false
 
  # Browser web app (web/) — static build served by Render's CDN. Vite bakes the
  # VITE_* vars in at build time; the anon key is set in the dashboard (public by
  # design, but kept out of git like the rest of web/.env).
  - type: web
    name: pocketlens-web
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    # SPA — client-side router owns all paths
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # Content-Security-Policy for the browser app. Kept here (deployment config,
    # easily edited) rather than baked into index.html so self-hosters on other
    # domains can adjust it without a rebuild. Only affects the deployed static
    # site — Vite dev server and Playwright e2e are unaffected. Origins allowed:
    #   script-src 'self'      — only our bundled JS, no external loader/tag
    #   style-src  'unsafe-inline' + fonts.googleapis.com — Vite/Tailwind inject
    #                            inline styles; index.css @imports the Google Fonts
    #                            stylesheet (Inter / JetBrains Mono / Playfair)
    #   font-src   fonts.gstatic.com — the actual font files that stylesheet pulls
    #   img-src    data: https: — inlined icons + remote bank/institution logos
    #   connect-src *.supabase.co (REST + auth), *.onrender.com (pocketlens-api)
    #   frame-ancestors/object-src 'none', base-uri/form-action 'self' — hardening
    #     (Plaid Link is NOT embedded here — it runs on the backend-hosted /link
    #      page opened in a separate tab — so no frame-src for Plaid is needed)
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co https://*.onrender.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'"
    # Vite bakes these VITE_* values in at build time, so they are prompted for on
    # first deploy (sync:false) rather than hardcoded here. Fill them in the Render
    # dashboard (or Blueprint prompt) with your own project/service URLs.
    envVars:
      # Your Supabase project URL, e.g. https://YOUR-PROJECT.supabase.co
      - key: VITE_SUPABASE_URL
        sync: false
      # Your Supabase anon (publishable) key — public by design
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      # Both point at the api service above. data/sync.ts + data/plaidCredentials.ts
      # read VITE_BACKEND_URL; the legacy api/client.ts reads VITE_API_BASE_URL.
      # Set both to your api URL, e.g. https://your-api.onrender.com
      - key: VITE_BACKEND_URL
        sync: false
      - key: VITE_API_BASE_URL
        sync: false
