# nginx config for serving the PocketLens web build (a Vite single-page app).
# Used by web/Dockerfile. The Content-Security-Policy mirrors the one in the root
# render.yaml — adjust connect-src to your own Supabase + API origins if you want to
# tighten it from the wildcards below.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: unknown paths serve index.html so the client-side router owns routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache the hashed build assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Recommended security headers. connect-src must reach your Supabase + API origins;
    # the wildcards below cover Supabase (*.supabase.co) and Render (*.onrender.com) —
    # replace them with your exact origins for a stricter policy.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co https://*.onrender.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
}
