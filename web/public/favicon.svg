  <circle cx="16" cy="16" r="8" fill="none" stroke="#F7F7F7" stroke-width="2.6"/>
  <circle cx="16" cy="16" r="4" fill="#111111"/>
  <circle cx="13" cy="13" r="1.5" fill="#F7F7F7"/>
</svg>
