[pytest]
# Two test tiers, routed by marker:
#   logic       — fakes-only, no docker/DB. Everything NOT marked `integration`.
#                 Run `pytest -m "not integration"`; new files here need no wiring.
#   integration — needs a local Supabase (`supabase start`). Mark the file/class/test
#                 with `@pytest.mark.integration`; run `pytest -m integration`.
markers =
    integration: test needs a live local Supabase (Postgres + GoTrue + PostgREST)
