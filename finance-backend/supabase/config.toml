# Supabase local dev config — generated by `supabase init`
# This file is committed to version control.
# For secrets, use environment variables or the dashboard.

[api]
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
port = 54323
api_url = "http://localhost"

[inbucket]
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
file_size_limit = "50MiB"

[auth]
# Mirror prod behavior: public signup is open (the app has a Sign Up tab).
# site_url is where auth emails land — the local web app, not the 3000 default.
site_url = "http://localhost:5173"
additional_redirect_urls = []
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
email.enable_confirmations = false
